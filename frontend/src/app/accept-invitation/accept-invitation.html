<div class="auth-page">
  <h1>VetBreath</h1>
  <p class="subtitle">Set your password to get started</p>

  <form [formRoot]="invitationForm" (submit)="onSubmit($event)" class="auth-form">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <label>
      Choose a password
      <input type="password" [formField]="invitationForm.password" />
    </label>

    <button type="submit" [disabled]="invitationForm().submitting() || invitationForm().invalid()">
      {{ invitationForm().submitting() ? 'Activating...' : 'Accept invitation' }}
    </button>
  </form>
</div>
