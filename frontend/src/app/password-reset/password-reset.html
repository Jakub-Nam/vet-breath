<div class="auth-page">
  <h1>VetBreath</h1>

  @if (!hasToken) {
    <p class="subtitle">Reset your password</p>

    <form (ngSubmit)="requestReset()" class="auth-form">
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }
      @if (success()) {
        <div class="success">{{ success() }}</div>
      }

      <label>
        Email
        <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
      </label>

      <button type="submit" [disabled]="loading() || !email()">
        {{ loading() ? 'Sending...' : 'Send reset link' }}
      </button>
    </form>
  } @else {
    <p class="subtitle">Choose a new password</p>

    <form (ngSubmit)="resetPassword()" class="auth-form">
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <label>
        New password
        <input type="password" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" name="password" required />
      </label>

      <button type="submit" [disabled]="loading() || !newPassword()">
        {{ loading() ? 'Resetting...' : 'Reset password' }}
      </button>
    </form>
  }

  <p class="link"><a routerLink="/login">Back to login</a></p>
</div>
