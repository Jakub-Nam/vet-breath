<div class="auth-page">
  <h1>VetBreath</h1>
  <p class="subtitle">Sign in to your account</p>

  <form [formRoot]="loginForm" (submit)="onSubmit($event)" class="auth-form">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" [formField]="loginForm.email" />
    </label>
    @if (loginForm.email().touched() && loginForm.email().invalid()) {
      <div class="error">Enter a valid email address.</div>
    }

    <label>
      Password
      <input type="password" [formField]="loginForm.password" />
    </label>
    @if (loginForm.password().touched() && loginForm.password().invalid()) {
      <div class="error">Password is required.</div>
    }

    <button type="submit" [disabled]="loginForm().submitting()">
      {{ loginForm().submitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <p class="link">Vet? <a routerLink="/register">Create an account</a></p>
</div>
