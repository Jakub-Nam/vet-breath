<div class="auth-page">
  <h1>VetBreath</h1>
  <p class="subtitle">Sign in to your account</p>

  <form (ngSubmit)="submit()" class="auth-form">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <label>
      Email
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
    </label>

    <label>
      Password
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required />
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <p class="link">Vet? <a routerLink="/register">Create an account</a></p>
  <p class="link"><a routerLink="/password-reset">Forgot password?</a></p>
</div>
